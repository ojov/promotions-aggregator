services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promotions
      POSTGRES_USER: promos
      POSTGRES_PASSWORD: promos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promos -d promotions"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
